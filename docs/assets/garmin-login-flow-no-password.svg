<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="zh-CN" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
<title id="diagram-title">Garmin 浏览器 MFA 登录流程与密码边界</title>
<desc id="diagram-desc">用户从 DSH 内嵌窗口或手动 CDP 后备打开本机桥页，在 Garmin 官方表单输入密码和验证码。桥页校验一次性 ticket，Host 换取 DI session 并探测账号，用户确认后保存到仅所有者可访问的本机文件。AI 和 MCP 客户端只接收工具结果。</desc>
<style><![CDATA[.headline { font: 700 34px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(30, 39, 52); }
      .deck { font: 500 15px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(78, 89, 105); }
      .title { font: 650 15px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(30, 39, 52); }
      .title-sm { font: 650 14px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(30, 39, 52); }
      .sub { font: 400 12px ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: rgb(78, 89, 105); }
      .sub-cn { font: 500 12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(78, 89, 105); }
      .lbl { font: 500 11.5px ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
      .kicker { font: 500 13px ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: rgb(125, 135, 150); letter-spacing: 0.08em; }
      .lane-title { font: 650 18px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(30, 39, 52); }
      .lane-sub { font: 400 11.5px ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: rgb(78, 89, 105); }
      .footer { font: 500 12px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; fill: rgb(78, 89, 105); }
      .node { fill: rgba(255, 255, 255, 0.88); stroke: rgba(68, 86, 113, 0.18); }
      .lane { fill: rgba(30, 39, 52, 0.04); }
      .secure-zone { fill: rgba(41, 134, 70, 0.08); stroke: rgba(41, 134, 70, 0.38); }
      .warning-zone { fill: rgba(178, 51, 159, 0.07); stroke: rgba(178, 51, 159, 0.34); }
      .chip { fill: rgba(41, 134, 70, 0.1); stroke: rgba(41, 134, 70, 0.38); }
      .chip-text { font: 600 11.5px ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: rgb(41, 134, 70); }
      .step { fill: rgb(244, 247, 251); stroke-width: 1.5; }
      .step-text { font: 650 11px ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; text-anchor: middle; dominant-baseline: central; }
      .s1 { stroke: rgb(60, 104, 217); } .s2 { stroke: rgb(0, 134, 135); } .s3 { stroke: rgb(178, 51, 159); } .s4 { stroke: rgb(41, 134, 70); }
      .f1 { fill: rgb(60, 104, 217); } .f2 { fill: rgb(0, 134, 135); } .f3 { fill: rgb(178, 51, 159); } .f4 { fill: rgb(41, 134, 70); }
      .sline { stroke: rgba(68, 86, 113, 0.18); } .fline { fill: rgba(68, 86, 113, 0.18); }
      .sfaint { stroke: rgb(125, 135, 150); } .ffaint { fill: rgb(125, 135, 150); }
      .fground { fill: rgb(244, 247, 251); }
      .glyph { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    ]]></style>
<rect width="1600" height="980" fill="rgb(244, 247, 251)"/>
      <defs>
        <marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="f1" d="M0 0 L10 5 L0 10 z"/>
        </marker>
        <marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="f2" d="M0 0 L10 5 L0 10 z"/>
        </marker>
        <marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="f3" d="M0 0 L10 5 L0 10 z"/>
        </marker>
        <marker id="m4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="f4" d="M0 0 L10 5 L0 10 z"/>
        </marker>
      </defs>

      <text class="kicker" x="55" y="42">GARMIN CONNECT · MFA LOGIN TRUST BOUNDARY</text>
      <text class="headline" x="55" y="82">浏览器 MFA：插件不接收密码</text>
      <text class="deck" x="55" y="112">密码与验证码只进入 Garmin 官方域；插件只处理一次性 ticket 和本机会话，AI 只看到工具结果。</text>
      <g transform="translate(1230, 48)">
        <rect class="chip" width="315" height="42" rx="21"/>
        <g class="s4 glyph" transform="translate(16, 7)">
  <rect x="6.5" y="12.5" width="15" height="11" rx="3"/>
  <path d="M10 12.5 V9.5 a4 4 0 0 1 8 0 v3"/>
  <path d="M14 16.5 v3"/>
</g>
        <text class="chip-text" x="54" y="26">无开发者中转服务器 · 本机直连</text>
      </g>

      <!-- lane bands -->
      <rect class="lane" x="290" y="145" width="1255" height="165" rx="16"/>
      <rect class="lane" x="290" y="330" width="1255" height="165" rx="16"/>
      <rect class="lane" x="290" y="515" width="1255" height="165" rx="16"/>
      <rect class="lane" x="290" y="700" width="1255" height="165" rx="16"/>

      <!-- lane owners -->
      <g transform="translate(55, 145)">
        <rect class="node" width="215" height="165" rx="16" stroke-width="1"/>
        <g class="s1 glyph" transform="translate(22, 34)">
  <circle cx="14" cy="9" r="5"/>
  <path d="M4 25 c1.5 -7 18.5 -7 20 0"/>
</g>
        <text class="lane-title" x="22" y="101">用户 / 浏览器</text>
        <text class="lane-sub" x="22" y="125">DSH WebView</text>
        <text class="lane-sub" x="22" y="145">或隔离 CDP 浏览器</text>
      </g>
      <g transform="translate(55, 330)">
        <rect class="node" width="215" height="165" rx="16" stroke-width="1"/>
        <g class="s2 glyph" transform="translate(22, 34)">
  <circle cx="14" cy="14" r="10"/>
  <path d="M4 14 h20"/>
  <ellipse cx="14" cy="14" rx="4.5" ry="10"/>
</g>
        <text class="lane-title" x="22" y="101">Garmin 官方服务</text>
        <text class="lane-sub" x="22" y="125">SSO + DI APIs</text>
        <text class="lane-sub" x="22" y="145">密码与验证码的接收方</text>
      </g>
      <g transform="translate(55, 515)">
        <rect class="node" width="215" height="165" rx="16" stroke-width="1"/>
        <g class="s1 glyph" transform="translate(22, 34)">
  <rect x="6.5" y="12.5" width="15" height="11" rx="3"/>
  <path d="M10 12.5 V9.5 a4 4 0 0 1 8 0 v3"/>
  <path d="M14 16.5 v3"/>
</g>
        <text class="lane-title" x="22" y="101">本机插件 Host</text>
        <text class="lane-sub" x="22" y="125">127.0.0.1 only</text>
        <text class="lane-sub" x="22" y="145">不接收密码 / MFA</text>
      </g>
      <g transform="translate(55, 700)">
        <rect class="node" width="215" height="165" rx="16" stroke-width="1"/>
        <g class="s3 glyph" transform="translate(22, 34)">
  <rect x="7" y="7" width="14" height="14" rx="2.5"/>
  <rect x="11.5" y="11.5" width="5" height="5"/>
  <path d="M10 7 V4 M14 7 V4 M18 7 V4 M10 21 v3 M14 21 v3 M18 21 v3"/>
  <path d="M7 10 H4 M7 14 H4 M7 18 H4 M21 10 h3 M21 14 h3 M21 18 h3"/>
</g>
        <text class="lane-title" x="22" y="101">AI / MCP 客户端</text>
        <text class="lane-sub" x="22" y="125">登录阶段不参与</text>
        <text class="lane-sub" x="22" y="145">只接收工具结果</text>
      </g>

      <!-- 1: user starts -->
      <circle class="f1" cx="302" cy="228" r="5"/>
      <path class="s1" d="M308 228 H316" stroke-width="1.8" marker-end="url(#m1)"/>
      <g transform="translate(320, 188)">
        <rect class="node" width="190" height="80" rx="14" stroke-width="1"/>
        <circle class="step s1" cx="22" cy="20" r="13"/>
        <text class="step-text f1" x="22" y="20">1</text>
        <g class="s1 glyph" transform="translate(18, 37)">
  <rect x="8" y="3.5" width="12" height="21" rx="3"/>
  <path d="M12.5 21 h3"/>
</g>
        <text class="title" x="58" y="35">点击账号“登录”</text>
        <text class="sub-cn" x="58" y="59">明确的用户操作</text>
      </g>

      <!-- 2: default and explicit fallback -->
      <g transform="translate(545, 158)">
        <rect class="node" width="210" height="62" rx="14" stroke-width="1"/>
        <circle class="step s1" cx="20" cy="18" r="12"/>
        <text class="step-text f1" x="20" y="18">2a</text>
        <text class="title-sm" x="47" y="27">内嵌窗口（默认）</text>
        <text class="sub" x="47" y="48">DSH WebView</text>
      </g>
      <g transform="translate(545, 235)">
        <rect class="warning-zone" width="210" height="62" rx="14" stroke-width="1"/>
        <circle class="step s3" cx="20" cy="18" r="12"/>
        <text class="step-text f3" x="20" y="18">2b</text>
        <text class="title-sm" x="47" y="27">CDP 后备（手动）</text>
        <text class="sub" x="47" y="48">临时隔离 profile</text>
      </g>
      <path class="s1" d="M510 216 H528 V189 H541" stroke-width="1.8" marker-end="url(#m1)"/>
      <path class="s3" d="M510 240 H528 V266 H541" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m3)"/>
      <text class="lbl f3" x="650" y="306" text-anchor="middle">内嵌失败时才由用户选择 · 不自动切换</text>

      <!-- 3: one-time local bridge -->
      <g transform="translate(760, 558)">
        <rect class="node" width="210" height="80" rx="14" stroke-width="1"/>
        <circle class="step s1" cx="22" cy="20" r="13"/>
        <text class="step-text f1" x="22" y="20">3</text>
        <g class="s1 glyph" transform="translate(18, 38)">
  <circle cx="14" cy="6.5" r="3"/>
  <circle cx="6" cy="21.5" r="3"/>
  <circle cx="22" cy="21.5" r="3"/>
  <path d="M12.6 9.2 L7.6 18.9 M15.4 9.2 l4.9 9.7 M9 21.5 h10"/>
</g>
        <text class="title-sm" x="58" y="34">一次性回环桥页</text>
        <text class="sub" x="58" y="58">随机 127.0.0.1 端口</text>
      </g>
      <path class="s1" d="M755 189 H785 V420 H820 V554" stroke-width="1.8" marker-end="url(#m1)"/>
      <text class="lbl f1" x="798" y="372">默认入口</text>
      <path class="s3" d="M710 297 V468 H811 Q820 450 829 468 H905 V554" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m3)"/>
      <text class="lbl f3" x="778" y="486">CDP 仍打开同一桥页</text>

      <!-- 4 + 5: official form and the only credential path -->
      <g transform="translate(925, 372)">
        <rect class="secure-zone" width="225" height="82" rx="14" stroke-width="1"/>
        <circle class="step s2" cx="22" cy="20" r="13"/>
        <text class="step-text f2" x="22" y="20">4</text>
        <g class="s2 glyph" transform="translate(18, 39)">
  <rect x="6.5" y="12.5" width="15" height="11" rx="3"/>
  <path d="M10 12.5 V9.5 a4 4 0 0 1 8 0 v3"/>
  <path d="M14 16.5 v3"/>
</g>
        <text class="title-sm" x="58" y="35">Garmin 官方登录表单</text>
        <text class="sub" x="58" y="60">sso.garmin.com / .cn</text>
      </g>
      <g transform="translate(925, 186)">
        <rect class="secure-zone" width="225" height="84" rx="14" stroke-width="1"/>
        <circle class="step s2" cx="22" cy="20" r="13"/>
        <text class="step-text f2" x="22" y="20">5</text>
        <g class="s2 glyph" transform="translate(18, 41)">
  <circle cx="9.5" cy="9.5" r="5"/>
  <path d="M13.1 13.1 L23.5 23.5 M19.8 19.8 l2.7 -2.7"/>
</g>
        <text class="title" x="58" y="35">输入密码与 MFA</text>
        <text class="sub-cn" x="58" y="60">插件 JS 跨域不可读</text>
      </g>
      <path class="s1" d="M970 598 H992 V478 H1038 V458" stroke-width="1.8" marker-end="url(#m1)"/>
      <text class="lbl f1" x="1005" y="520">加载官方页面</text>
      <path class="s2" d="M1038 270 V368" stroke-width="2.2" marker-end="url(#m2)"/>
      <text class="lbl f2" x="1052" y="319">唯一凭据路径</text>

      <!-- 6: Garmin returns a one-time ticket, never the password -->
      <g transform="translate(1180, 372)">
        <rect class="node" width="205" height="82" rx="14" stroke-width="1"/>
        <circle class="step s1" cx="22" cy="20" r="13"/>
        <text class="step-text f1" x="22" y="20">6</text>
        <g class="s1 glyph" transform="translate(18, 39)">
  <circle cx="9.5" cy="9.5" r="5"/>
  <path d="M13.1 13.1 L23.5 23.5 M19.8 19.8 l2.7 -2.7"/>
</g>
        <text class="title-sm" x="58" y="35">签发一次性 ticket</text>
        <text class="sub-cn" x="58" y="60">短期有效 · 一次性使用</text>
      </g>
      <path class="s1" d="M1150 413 H1176" stroke-width="1.8" marker-end="url(#m1)"/>
      <text class="lbl f1" x="1163" y="397" text-anchor="middle">认证成功</text>

      <!-- 7: validate + exchange, 8: user confirmation, 9: private save -->
      <g transform="translate(1070, 553)">
        <rect class="node" width="285" height="90" rx="14" stroke-width="1"/>
        <circle class="step s1" cx="22" cy="20" r="13"/>
        <text class="step-text f1" x="22" y="20">7</text>
        <g class="s1 glyph" transform="translate(18, 45)">
  <circle cx="14" cy="14" r="10"/>
  <path d="M9.5 14.5 l3 3 6 -6.5"/>
</g>
        <text class="title" x="58" y="36">校验 ticket 并换取 DI session</text>
        <text class="sub-cn" x="58" y="61">严格校验区域 / 来源 / service</text>
        <text class="sub" x="58" y="80">profile probe</text>
      </g>
      <path class="s1" d="M1283 454 V549" stroke-width="1.8" marker-end="url(#m1)"/>
      <text class="lbl f1" x="1298" y="505">一次性 ticket</text>

      <g transform="translate(1365, 188)">
        <rect class="node" width="165" height="80" rx="14" stroke-width="1"/>
        <circle class="step s2" cx="22" cy="20" r="13"/>
        <text class="step-text f2" x="22" y="20">8</text>
        <g class="s2 glyph" transform="translate(18, 38)">
  <circle cx="14" cy="14" r="10"/>
  <path d="M9.5 14.5 l3 3 6 -6.5"/>
</g>
        <text class="title-sm" x="58" y="34">确认账号</text>
        <text class="sub" x="58" y="58">脱敏 profile</text>
      </g>
      <path class="s2" d="M1215 553 V530 H1274 Q1283 512 1292 530 H1405 V290 H1416 V272" stroke-width="1.8" marker-end="url(#m2)"/>
      <text class="lbl f2" x="1394" y="350" text-anchor="end">只返回脱敏 profile</text>

      <g transform="translate(1365, 558)">
        <rect class="secure-zone" width="165" height="85" rx="14" stroke-width="1"/>
        <circle class="step s4" cx="22" cy="20" r="13"/>
        <text class="step-text f4" x="22" y="20">9</text>
        <g class="s4 glyph" transform="translate(18, 41)">
  <path d="M3.5 22 V6.5 a2 2 0 0 1 2 -2 h4.6 a2 2 0 0 1 1.6 0.8 l1.7 2.2 h9.1 a2 2 0 0 1 2 2 V22 a2 2 0 0 1 -2 2 h-17 a2 2 0 0 1 -2 -2 z"/>
</g>
        <text class="title-sm" x="58" y="35">私有保存</text>
        <text class="sub" x="58" y="58">原子写入</text>
<text class="sub-cn" x="58" y="75">仅所有者可读</text>
      </g>
      <path class="s4" d="M1448 268 V554" stroke-width="1.8" marker-end="url(#m4)"/>
      <text class="lbl f4" x="1545" y="424" text-anchor="end">用户确认后才落盘</text>

      <!-- AI boundary and post-login result -->
      <g transform="translate(500, 740)">
        <rect class="warning-zone" width="790" height="86" rx="16" stroke-width="1"/>
        <g class="s3 glyph" transform="translate(24, 29)">
  <rect x="6.5" y="12.5" width="15" height="11" rx="3"/>
  <path d="M10 12.5 V9.5 a4 4 0 0 1 8 0 v3"/>
  <path d="M14 16.5 v3"/>
</g>
        <text class="title" x="68" y="33">AI / MCP 客户端 登录全程拿不到</text>
        <text class="sub-cn" x="68" y="60">密码 · MFA 验证码 · service ticket · DI token · Cookie · session 文件内容</text>
      </g>
      <g transform="translate(1365, 742)">
        <rect class="secure-zone" width="165" height="82" rx="14" stroke-width="1"/>
        <circle class="step s4" cx="22" cy="20" r="13"/>
        <text class="step-text f4" x="22" y="20">10</text>
        <g class="s4 glyph" transform="translate(18, 39)">
  <path d="M11.5 4 c-3.2 0 -4 1.2 -4 4 c0 2.6 0 4.4 -3.5 6 c3.5 1.6 3.5 3.4 3.5 6 c0 2.8 0.8 4 4 4"/>
  <path d="M16.5 4 c3.2 0 4 1.2 4 4 c0 2.6 0 4.4 3.5 6 c-3.5 1.6 -3.5 3.4 -3.5 6 c0 2.8 -0.8 4 -4 4"/>
</g>
        <text class="title-sm" x="58" y="34">认证后调用</text>
        <text class="sub-cn" x="58" y="59">只返回工具结果</text>
      </g>
      <path class="s4" d="M1448 643 V738" stroke-width="1.8" marker-end="url(#m4)"/>
      <text class="lbl f4" x="1463" y="692">登录完成</text>

      <text class="footer" x="55" y="930">安全结论：此浏览器 MFA 流程不接收密码或验证码；DI session 经用户确认后保存到本机，仅所有者可访问。</text>
      <text class="footer" x="1545" y="930" text-anchor="end">默认内嵌 · CDP 仅作用户手动后备</text>
    </svg>
